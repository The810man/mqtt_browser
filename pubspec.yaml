name: mqtt_browser
description: MQTT-Browser by Paul Rempel from 810 Games

publish_to: "none"

version: 1.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_fancy_tree_view: ^1.4.1
  flutter_riverpod: ^3.0.1
  riverpod_annotation: ^4.0.0
  provider: ^6.1.2
  go_router: ^17.0.0
  loading_icon_button: ^1.0.2
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  code_editor: ^2.1.0
  code_text_field: ^1.1.0
  dotted_border: ^3.1.0
  cross_scroll: ^0.1.1
  collection: any
  resizable_widget: ^1.0.5
  sidebarx: ^0.17.2
  flutter_code_editor: ^0.3.1
  popup_menu: ^2.0.0
  circular_menu: ^4.0.0
  menu_bar: ^0.5.3
  hooks_riverpod: ^3.0.1
  flutter_hooks: ^0.21.3+1
  json_editor: ^0.0.8
  smooth_highlight: ^0.1.1
  deepcopy: ^1.1.2
  flutter_phoenix: ^1.1.1
  restart_app: ^1.2.1
  flutter_echarts: ^2.5.0
  flutter_charts: ^0.5.2
  graphview: ^1.2.0
  json_view: ^0.4.2
  expandable: ^5.0.1
  js: ^0.7.1
  mqtt5_client: ^4.15.2
  vitality: ^3.0.0
  package_info_plus: ^9.0.0
  desktop_window: ^0.4.0
  path_provider: any
  shared_preferences: ^2.3.2
  fl_chart: ^1.1.0
  syncfusion_flutter_charts: ^29.1.33
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.0+1  # CRITICAL: Generates @Riverpod .g.dart
  flutter_lints: ^6.0.0
  test: ^1.25.2

dependency_overrides:
  vector_math: ^2.2.0

flutter:
  uses-material-design: true
  fonts:
    - family: MqttBackgroundGrid
      fonts:
        - asset: assets/fonts/MqttBackgroundGrid.ttf
