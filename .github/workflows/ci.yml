name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config clang cmake ninja-build
          flutter build linux --release

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Package .deb
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          APP_NAME=mqtt_browser
          fpm -s dir -t deb -n "$APP_NAME" -v "$VERSION" \
            --description "MQTT Browser" \
            --maintainer "CI" \
            --license "MIT" \
            --url "https://github.com/${{ github.repository }}" \
            -C build/linux/x64/release/bundle \
            .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: mqtt_browser-linux-deb
          path: ./*.deb

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mqtt_browser-windows-bundle
          path: build/windows/x64/runner/Release/
