name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Release Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Package .deb
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          APP_NAME=mqtt_browser
          fpm -s dir -t deb -n "$APP_NAME" -v "$VERSION" \
            --description "MQTT Browser" \
            --maintainer "CI" \
            --license "MIT" \
            --url "https://github.com/${{ github.repository }}" \
            -C build/linux/x64/release/bundle \
            .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: mqtt_browser-linux-deb
          path: ./*.deb

  build-windows:
    name: Release Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip Windows bundle
        run: |
          powershell -Command "Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mqtt_browser-windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mqtt_browser-windows-bundle
          path: mqtt_browser-windows.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: mqtt_browser-linux-deb

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: mqtt_browser-windows-bundle

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.zip
